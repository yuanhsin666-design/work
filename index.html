<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能动态排班工作表</title>
  <!-- 1. 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background: #f4f6f8; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #cbd5e1; text-align: center; }
    th { background-color: #f8fafc; font-weight: bold; }
    .staff-name { font-weight: bold; background-color: #f1f5f9; }
  </style>
</head>
<body>

  <div class="card">
    <h2>当月岗位强度汇总记录</h2>
    <table id="intensitySummaryTable"></table>
  </div>

  <script>
    // 假定数据结构（请根据实际 Supabase / 本地数据替换）
    let baseShifts = [
      { name: '岗位A', level: '高' },
      { name: '岗位B', level: '中' },
      { name: '岗位C', level: '低' }
    ];
    let supportShift = { name: '支援', level: '中' };
    let staffs = [
      { name: '大枢' }, { name: '宏' }, { name: 'YU' }, { name: '妮妮' },
      { name: '靓靓' }, { name: '阿翔' }, { name: 'Kay' }, { name: '达西' },
      { name: 'Q娜' }, { name: '海绵' }, { name: '闵诗' }, { name: 'DKK' },
      { name: '施施' }, { name: '小克' }, { name: '小兔' }, { name: '孙孙' }, { name: '小美' }
    ];

    // 核心函数：渲染当月岗位强度汇总表
    function renderIntensitySummaryTable(scheduleData = null) {
      let allShifts = [...baseShifts.map(s => s.name), supportShift.name];
      let totalHigh = 0, totalMid = 0, totalLow = 0;
      let staffCount = staffs.length;
      
      let html = `
        <thead>
          <tr style="background-color: #f8fafc; font-weight: bold;">
            <th style="padding: 8px; width: 30%;">人员姓名</th>
            <th style="padding: 8px; width: 70%;">当月岗位强度汇总记录</th>
          </tr>
        </thead>
        <tbody>
      `;

      staffs.forEach((staff, sIdx) => {
        let highCount = 0;
        let midCount = 0;
        let lowCount = 0;

        allShifts.forEach(shiftName => {
          let count = (scheduleData && scheduleData[sIdx]) ? scheduleData[sIdx].filter(item => item === shiftName).length : 0;
          let foundShift = baseShifts.find(s => s.name === shiftName);
          if (foundShift) {
            if (foundShift.level === '高') highCount += count;
            else if (foundShift.level === '中') midCount += count;
            else if (foundShift.level === '低') lowCount += count;
          }
        });

        totalHigh += highCount;
        totalMid += midCount;
        totalLow += lowCount;

        // 强行同一行展示 (white-space: nowrap)
        html += `
          <tr>
            <td class="staff-name" style="padding: 8px;">${staff.name}</td>
            <td style="padding: 8px; text-align: center; font-size: 13px; font-weight: bold; white-space: nowrap;">
              <span style="color: #c62828;">🔴高:${highCount}</span> &nbsp;&nbsp;&nbsp;&nbsp;
              <span style="color: #8c6b00;">🟡中:${midCount}</span> &nbsp;&nbsp;&nbsp;&nbsp;
              <span style="color: #1b5e20;">🟢低:${lowCount}</span>
            </td>
          </tr>
        `;
      });

      // 计算平均值
      let avgHigh = staffCount ? (totalHigh / staffCount).toFixed(1) : "0.0";
      let avgMid = staffCount ? (totalMid / staffCount).toFixed(1) : "0.0";
      let avgLow = staffCount ? (totalLow / staffCount).toFixed(1) : "0.0";

      // 底部平均值汇总行
      html += `
        <tr style="background-color: #e2e8f0; font-weight: bold;">
          <td style="padding: 8px; text-align: center; color: #1e293b;">每人平均</td>
          <td style="padding: 8px; text-align: center; font-size: 13px; white-space: nowrap;">
            <span style="color: #c62828;">高每人平均 ${avgHigh}</span> &nbsp;&nbsp;&nbsp;&nbsp;
            <span style="color: #8c6b00;">中每人平均 ${avgMid}</span> &nbsp;&nbsp;&nbsp;&nbsp;
            <span style="color: #1b5e20;">低每人平均 ${avgLow}</span>
          </td>
        </tr>
      `;

      html += `</tbody>`;
      document.getElementById('intensitySummaryTable').innerHTML = html;
    }

    // 关键修正：防止旧函数名未定义导致报错的兼容映射
    function renderHighIntensityTable(scheduleData = null) {
      renderIntensitySummaryTable(scheduleData);
    }

    // 页面加载后首次渲染
    document.addEventListener("DOMContentLoaded", () => {
      renderIntensitySummaryTable();
    });
  </script>
</body>
</html>
