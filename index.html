<script>
  const SUPABASE_URL = 'https://sgtxweyklcyimerwvuhu.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_IiIoN5F_XaIqEsvmKmzdqg_7jqR7Qcb';[cite: 2]
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);[cite: 2]

  let defaultNames = ["大抠", "宏", "YU", "妮妮", "靓靓", "阿翔", "Kay", "达西", "Q娜", "海绵", "闵诗", "DKK", "施施", "小克", "小兔", "孫孫", "小美"];[cite: 2]
  let staffs = defaultNames.map(name => ({ name }));[cite: 2]

  let baseShifts = [
    { name: "OL\nFB\nLY\nJY", level: "低" },
    { name: "MT\nXO\nSH\nYS", level: "中" },
    { name: "ND\n2500\n以下", level: "中" },
    { name: "ND\n中大\n2501\n以上\nXH", level: "高" },
    { name: "HS\n3000\n以下\nSY", level: "中" },
    { name: "HS大\n3001\n以上\nXY", level: "高" },
    { name: "YD", level: "低" },
    { name: "RF\n3000\n以下\nJD", level: "中" },
    { name: "RF\n3001\n以上\nLS", level: "高" },
    { name: "TD\n1000\n以下", level: "低" },
    { name: "TD\n1001\n5000", level: "中" },
    { name: "TD\n5001\n以上", level: "高" }
  ];[cite: 2]

  let supportShift = { name: "支援\nND\nHS\nYD", level: "支援" };[cite: 2]
  const weekDays = ["日", "一", "二", "三", "四", "五", "六"];[cite: 2]
  
  let currentMonthRests = {};[cite: 2]
  let lastGeneratedSchedule = null;[cite: 2]
  let lockedMap = [];[cite: 2]

  function getMonthKey() {[cite: 2]
    const year = document.getElementById('yearSelect').value;[cite: 2]
    const month = document.getElementById('monthSelect').value;[cite: 2]
    return `${year}-${month}`;[cite: 2]
  }

  function initLockedMap(forceReset = false) {[cite: 2]
    const year = parseInt(document.getElementById('yearSelect').value || new Date().getFullYear());[cite: 2]
    const month = parseInt(document.getElementById('monthSelect').value || (new Date().getMonth() + 1));[cite: 2]
    const totalDays = getDaysInMonth(year, month);[cite: 2]

    if (forceReset || !lockedMap || lockedMap.length !== staffs.length || (lockedMap[0] && lockedMap[0].length !== totalDays)) {[cite: 2]
      lockedMap = Array.from({ length: staffs.length }, () => Array(totalDays).fill(false));[cite: 2]
    }
  }

  function saveGlobalConfig() {[cite: 2]
    localStorage.setItem('auto_schedule_global_config_v2', JSON.stringify({ staffs, baseShifts, supportShift }));[cite: 2]
  }

  function loadGlobalConfig() {[cite: 2]
    const saved = localStorage.getItem('auto_schedule_global_config_v2');[cite: 2]
    if (saved) {[cite: 2]
      try {[cite: 2]
        const data = JSON.parse(saved);[cite: 2]
        if (data.staffs) staffs = data.staffs;[cite: 2]
        if (data.baseShifts) baseShifts = data.baseShifts;[cite: 2]
        if (data.supportShift) supportShift = data.supportShift;[cite: 2]
      } catch(e) { console.error(e); }[cite: 2]
    }
  }

  function sanitizeSchedule(sched) {[cite: 2]
    if (!sched) return null;[cite: 2]
    return sched.map(row => row.map(cell => (cell === "休(预)" || cell === "休(預)") ? "休" : cell));[cite: 2]
  }

  async function saveDataToLocal() {[cite: 2]
    saveGlobalConfig();[cite: 2]
    const monthKey = getMonthKey();[cite: 2]
    
    const monthData = {[cite: 2]
      currentMonthRests: currentMonthRests,[cite: 2]
      lastGeneratedSchedule: sanitizeSchedule(lastGeneratedSchedule),[cite: 2]
      lockedMap: lockedMap,[cite: 2]
      cloudUrl: document.getElementById('cloudUrlInput').value[cite: 2]
    };[cite: 2]
    
    localStorage.setItem(`auto_schedule_month_${monthKey}`, JSON.stringify(monthData));[cite: 2]

    try {[cite: 2]
      await supabaseClient[cite: 2]
        .from('schedules')[cite: 2]
        .upsert({ month_key: monthKey, data: monthData }, { onConflict: 'month_key' });[cite: 2]
    } catch (err) { console.error("Supabase 连线失败：", err); }[cite: 2]
  }

  async function loadDataFromLocal() {[cite: 2]
    loadGlobalConfig();[cite: 2]
    const monthKey = getMonthKey();[cite: 2]
    const year = parseInt(document.getElementById('yearSelect').value);[cite: 2]
    const month = parseInt(document.getElementById('monthSelect').value);[cite: 2]
    const totalDays = getDaysInMonth(year, month);[cite: 2]

    let data = null;[cite: 2]

    try {[cite: 2]
      const { data: cloudRes, error } = await supabaseClient[cite: 2]
        .from('schedules')[cite: 2]
        .select('data')[cite: 2]
        .eq('month_key', monthKey)[cite: 2]
        .maybeSingle();[cite: 2]

      if (!error && cloudRes && cloudRes.data) data = cloudRes.data;[cite: 2]
    } catch (err) { console.warn("无法连接云端，改用本地缓存：", err); }[cite: 2]

    if (!data) {[cite: 2]
      const savedMonth = localStorage.getItem(`auto_schedule_month_${monthKey}`);[cite: 2]
      if (savedMonth) {[cite: 2]
        try { data = JSON.parse(savedMonth); } catch(e) { console.error(e); }[cite: 2]
      }
    }

    if (!data) {[cite: 2]
      currentMonthRests = {};[cite: 2]
      lastGeneratedSchedule = null;[cite: 2]
      lockedMap = Array.from({ length: staffs.length }, () => Array(totalDays).fill(false));[cite: 2]
      document.getElementById('cloudUrlInput').value = "";[cite: 2]
      return false;[cite: 2]
    }

    currentMonthRests = data.currentMonthRests || {};[cite: 2]
    lastGeneratedSchedule = sanitizeSchedule(data.lastGeneratedSchedule);[cite: 2]
    lockedMap = data.lockedMap || Array.from({ length: staffs.length }, () => Array(totalDays).fill(false));[cite: 2]
    document.getElementById('cloudUrlInput').value = data.cloudUrl || "";[cite: 2]
    return true;[cite: 2]
  }

  async function resetCurrentMonthData() {[cite: 2]
    const monthKey = getMonthKey();[cite: 2]
    if (confirm(`确定要重置 [${monthKey}] 月份的数据吗？`)) {[cite: 2]
      currentMonthRests = {};[cite: 2]
      lastGeneratedSchedule = null;[cite: 2]
      initLockedMap(true);[cite: 2]
      document.getElementById('cloudUrlInput').value = "";[cite: 2]

      localStorage.removeItem(`auto_schedule_month_${monthKey}`);[cite: 2]

      try {[cite: 2]
        await supabaseClient.from('schedules').delete().eq('month_key', monthKey);[cite: 2]
      } catch (err) { console.error("云端重置失败：", err); }[cite: 2]

      renderAll();[cite: 2]
      document.getElementById('status').innerText = `🗑️ 已重置 [${monthKey}] 的数据！`;[cite: 2]
      alert(`[${monthKey}] 月份数据已成功重置！`);[cite: 2]
    }
  }

  function parseCSV(text) {[cite: 2]
    let lines = text.split(/\r\n|\n/);[cite: 2]
    return lines.map(line => {[cite: 2]
      let cells = [];[cite: 2]
      let inQuotes = false;[cite: 2]
      let cell = '';[cite: 2]
      for (let i = 0; i < line.length; i++) {[cite: 2]
        let char = line[i];[cite: 2]
        if (char === '"') inQuotes = !inQuotes;[cite: 2]
        else if (char === ',' && !inQuotes) { cells.push(cell.trim()); cell = ''; }[cite: 2]
        else cell += char;[cite: 2]
      }
      cells.push(cell.trim());[cite: 2]
      return cells;[cite: 2]
    });
  }

  async function fetchCloudRests() {[cite: 2]
    let rawUrl = document.getElementById('cloudUrlInput').value.trim();[cite: 2]
    if (!rawUrl) return alert("请先输入当前月份的云端链接！");[cite: 2]

    let targetUrl = rawUrl;[cite: 2]
    if (rawUrl.includes("docs.google.com/spreadsheets")) {[cite: 2]
      const match = rawUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);[cite: 2]
      if (match && match[1]) {[cite: 2]
        const sheetId = match[1];[cite: 2]
        let gidMatch = rawUrl.match(/gid=([0-9]+)/);[cite: 2]
        let gidParam = gidMatch ? `&gid=${gidMatch[1]}` : "";[cite: 2]
        targetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv${gidParam}`;[cite: 2]
      }
    }

    const monthKey = getMonthKey();[cite: 2]
    document.getElementById('status').innerText = `⏳ 正在读取 [${monthKey}] 的云端假表...`;[cite: 2]

    try {[cite: 2]
      const response = await fetch(targetUrl);[cite: 2]
      if (!response.ok) throw new Error("无法读取，请确认链接权限。");[cite: 2]
      
      const csvText = await response.text();[cite: 2]
      const rows = parseCSV(csvText);[cite: 2]

      const year = parseInt(document.getElementById('yearSelect').value);[cite: 2]
      const month = parseInt(document.getElementById('monthSelect').value);[cite: 2]
      const totalDays = getDaysInMonth(year, month);[cite: 2]

      currentMonthRests = {};[cite: 2]
      let dayColumnMap = {};[cite: 2]
      let headerRowIndex = -1;[cite: 2]

      for (let r = 0; r < rows.length; r++) {[cite: 2]
        let row = rows[r];[cite: 2]
        for (let c = 0; c < row.length; c++) {[cite: 2]
          let num = parseInt(row[c]);[cite: 2]
          if (!isNaN(num) && num >= 1 && num <= 31) {[cite: 2]
            dayColumnMap[c] = num;[cite: 2]
            headerRowIndex = r;[cite: 2]
          }
        }
        if (headerRowIndex !== -1) break;[cite: 2]
      }

      let updatedCount = 0;[cite: 2]
      for (let r = 0; r < rows.length; r++) {[cite: 2]
        let row = rows[r];[cite: 2]
        if (row.length === 0) continue;[cite: 2]
        
        let rawName = row[0] ? row[0].replace(/"/g, '').trim() : '';[cite: 2]
        let cleanNameInRow = rawName.replace(/\s+/g, '');[cite: 2]
        if (!cleanNameInRow) continue;[cite: 2]

        const sIdx = staffs.findIndex(s => {[cite: 2]
          let cleanStaffName = s.name.replace(/\s+/g, '');[cite: 2]
          return cleanStaffName === cleanNameInRow ||[cite: 2]
                 (cleanStaffName === "孫孫" && cleanNameInRow === "孙孙") ||[cite: 2]
                 (cleanStaffName === "孙孙" && cleanNameInRow === "孫孫") ||[cite: 2]
                 (cleanStaffName === "阿翔" && cleanNameInRow === "翔") ||[cite: 2]
                 (cleanStaffName === "翔" && cleanNameInRow === "阿翔");[cite: 2]
        });

        if (sIdx !== -1) {[cite: 2]
          updatedCount++;[cite: 2]
          let rests = [];[cite: 2]
          for (let c = 1; c < row.length; c++) {[cite: 2]
            if (row[c] && row[c].trim() === '1') {[cite: 2]
              let day = dayColumnMap[c] || c;[cite: 2]
              if (day >= 1 && day <= totalDays) rests.push(day);[cite: 2]
            }
          }
          currentMonthRests[sIdx] = Array.from(new Set(rests));[cite: 2]
        }
      }

      renderAll();[cite: 2]
      await saveDataToLocal();[cite: 2]
      document.getElementById('status').innerText = `✅ [${monthKey}] 假表抓取成功！匹配 ${updatedCount} 人。`;[cite: 2]
      alert(`[${monthKey}] 假表读取成功！已为 ${updatedCount} 位员工导入当月休假。`);[cite: 2]
    } catch (err) {[cite: 2]
      alert("抓取失败：" + err.message);[cite: 2]
      document.getElementById('status').innerText = "❌ 读取失败";[cite: 2]
    }
  }

  function initDateSelectors() {[cite: 2]
    const yearSelect = document.getElementById('yearSelect');[cite: 2]
    const monthSelect = document.getElementById('monthSelect');[cite: 2]
    const currentYear = new Date().getFullYear();[cite: 2]
    const currentMonth = new Date().getMonth() + 1;[cite: 2]

    for (let y = currentYear - 1; y <= currentYear + 2; y++) {[cite: 2]
      yearSelect.innerHTML += `<option value="${y}" ${y === currentYear ? 'selected' : ''}>${y} 年</option>`;[cite: 2]

  function renderShifts() {[cite: 2]
    const container = document.getElementById('shiftsContainer');[cite: 2]
