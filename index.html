<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>跨浏览器数据同步系统</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
    .box { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    input, button, textarea { display: block; width: 100%; margin-top: 10px; padding: 8px; box-sizing: border-box; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- 1. 登录 / 注册 区块 -->
  <div id="auth-section" class="box">
    <h2>账号登录 / 注册</h2>
    <input type="text" id="username" placeholder="请输入自定义账号 (例如: user123)">
    <input type="password" id="password" placeholder="请输入密码 (至少 6 位)">
    <button id="btn-login">登录</button>
    <button id="btn-register">注册新账号</button>
  </div>

  <!-- 2. 登录后的主要数据编辑区块 -->
  <div id="app-section" class="box hidden">
    <h2>欢迎，<span id="user-display"></span>！</h2>
    <p>你的数据在云端已同步，换任何浏览器登录都能看到：</p>
    
    <textarea id="user-data-input" rows="5" placeholder="在这里输入你想留存的资料..."></textarea>
    <button id="btn-save">保存更新至云端</button>
    <button id="btn-logout" style="background-color: #f44336; color: white;">退出登录</button>
  </div>

  <!-- 引入 Firebase SDK (ES Module 方式) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 你的 Firebase 配置
    const firebaseConfig = {
      apiKey: "AIzaSyAKBsXGHxvmC-wpIXgYylu4wd4zO-jWT74",
      authDomain: "work-179d4.firebaseapp.com",
      projectId: "work-179d4",
      storageBucket: "work-179d4.firebasestorage.app",
      messagingSenderId: "159867192270",
      appId: "1:159867192270:web:3ce9ab395b950b9f3c619f",
      measurementId: "G-55J9WCJMLW"
    };

    // 初始化 Firebase、Auth 与 Firestore 数据库
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 辅助函数：将自定义账号转化为内部虚拟邮箱
    const formatEmail = (username) => `${username.trim().toLowerCase()}@myapp.local`;

    // DOM 元素引用
    const authSection = document.getElementById("auth-section");
    const appSection = document.getElementById("app-section");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const userDisplay = document.getElementById("user-display");
    const userDataInput = document.getElementById("user-data-input");

    // 1. 注册账号
    document.getElementById("btn-register").addEventListener("click", async () => {
      const username = usernameInput.value;
      const password = passwordInput.value;

      if (!username || !password) return alert("请输入完整的账号和密码！");
      const fakeEmail = formatEmail(username);

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, fakeEmail, password);
        const user = userCredential.user;

        // 在数据库建立初始化个人资料表
        await setDoc(doc(db, "users", user.uid), {
          username: username,
          savedData: "",
          updatedAt: new Date()
        });

        alert("注册成功并已自动登录！");
      } catch (error) {
        alert("注册失败: " + error.message);
      }
    });

    // 2. 登录账号
    document.getElementById("btn-login").addEventListener("click", async () => {
      const username = usernameInput.value;
      const password = passwordInput.value;

      if (!username || !password) return alert("请输入账号和密码！");
      const fakeEmail = formatEmail(username);

      try {
        await signInWithEmailAndPassword(auth, fakeEmail, password);
        alert("登录成功！");
      } catch (error) {
        alert("登录失败，请检查账号密码！");
      }
    });

    // 3. 监听登录状态（核心：实现跨浏览器/刷新页面保持状态与拉取资料）
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // 用户已登录：隐藏登录框，显示主应用界面
        authSection.classList.add("hidden");
        appSection.classList.remove("hidden");

        // 从 Firestore 读取该 UID 的云端资料
        const docRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const data = docSnap.data();
          userDisplay.textContent = data.username || "使用者";
          userDataInput.value = data.savedData || "";
        }
      } else {
        // 用户未登录：显示登录框，隐藏主应用界面
        authSection.classList.remove("hidden");
        appSection.classList.add("hidden");
      }
    });

   // 4. 保存数据到云端（并在保存后跳转）
document.getElementById("btn-save").addEventListener("click", async () => {
  const user = auth.currentUser;
  if (!user) return alert("请先登录！");

  try {
    // 1. 将资料保存至云端数据库
    await setDoc(doc(db, "users", user.uid), {
      savedData: userDataInput.value,
      updatedAt: new Date()
    }, { merge: true });

    alert("资料已同步保存至云端！即将跳转页面...");

    // 2. 跳转到你的网页（请替换为你具体的网页路径或 URL）
    https://work-sooty-nine.vercel.app/

  } catch (error) {
    alert("保存失败: " + error.message);
  }
});
  </script>
</body>
</html>
