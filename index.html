<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能动态排班工作表 (跨月份独立保存版)</title>
  <!-- 1. 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; background: #f4f6f8; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
    h2, h3 { margin-top: 0; color: #1e293b; }
    
    .controls-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 15px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: 0.2s; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover { background: #059669; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-secondary { background: #64748b; color: white; }
    
    select, input { padding: 7px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
    
    .table-container { overflow-x: auto; max-width: 100%; border: 1px solid #e2e8f0; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; white-space: nowrap; }
    th, td { border: 1px solid #e2e8f0; padding: 8px 5px; }
    th { background: #f8fafc; color: #475569; font-weight: bold; }
    
    .weekend { background-color: #fef2f2; }
    .weekend-header { color: #ef4444; }
    
    .shift-rest { background-color: #fee2e2; color: #991b1b; font-weight: bold; }
    .shift-support { background-color: #e0f2fe; color: #075985; font-weight: bold; }
    .shift-high { background-color: #fef3c7; color: #92400e; font-weight: bold; }
    .shift-normal { background-color: #f1f5f9; color: #334155; }
    
    .status-tag { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; display: inline-block; }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-error { background: #fee2e2; color: #b91c1c; }
    .status-info { background: #e0f2fe; color: #0369a1; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📅 智能动态排班工作表</h2>
    <div style="margin-bottom: 12px;">
      <span id="statusMessage" class="status-tag status-info">准备就绪</span>
    </div>
    <div class="controls-row">
      <label><b>选择年份：</b></label>
      <select id="yearSelect"></select>
      <label><b>选择月份：</b></label>
      <select id="monthSelect"></select>
      
      <button class="btn btn-primary" onclick="generateSchedule()">⚡ 执行智能排班</button>
      <button class="btn btn-success" onclick="saveCurrentMonthToSupabase()">💾 保存当前月至数据库</button>
      <button class="btn btn-danger" onclick="resetCurrentMonthData()">🔄 重置当前月份数据</button>
    </div>
  </div>

  <div class="card">
    <h3>📋 当月排班表</h3>
    <div class="table-container">
      <table id="scheduleTable"></table>
    </div>
  </div>

  <div class="card">
    <h3>📊 岗位与人员统计</h3>
    <div class="table-container">
      <table id="statsTable"></table>
    </div>
  </div>

  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h3 style="margin: 0;">🔵 每月拿支援的人员记录表</h3>
      <button class="btn btn-primary" style="padding: 5px 10px; font-size: 12px;" onclick="copySupportTable()">📋 复制记录表</button>
    </div>
    <div class="table-container">
      <table id="supportStaffTable"></table>
    </div>
  </div>

  <script>
    // Supabase 保持配置
    const SUPABASE_URL = "https://your-supabase-url.supabase.co"; 
    const SUPABASE_KEY = "your-anon-key";             
    let supabaseClient = null;

    try {
      if (typeof supabase !== 'undefined' && SUPABASE_URL.indexOf("your-supabase") === -1) {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }
    } catch(e) {
      console.warn("Supabase 未配置或加载失败，将使用本地模式运行。");
    }

    let staffs = [
      { id: 1, name: "妮妮" },
      { id: 2, name: "Kay" },
      { id: 3, name: "海绵" },
      { id: 4, name: "小兔" }
    ];

    let baseShifts = [
      { id: 1, name: "岗位A", highIntensity: true },
      { id: 2, name: "岗位B", highIntensity: false },
      { id: 3, name: "岗位C", highIntensity: false }
    ];

    let supportShift = { id: 99, name: "支援", highIntensity: false };
    let restShift = { id: 0, name: "休", highIntensity: false };

    let currentYear = 2026;
    let currentMonth = 8;
    let currentSchedule = null;

    // 跨月份历史支援数据存储对象 (格式: { "Kay": 1, "妮妮": 1 })
    let supportCumulativeMap = {
      "Kay": 1 // 预设 Kay 在 8 月之前或 8 月已有 1 次历史记录
    };

    window.onload = function() {
      initYearMonthSelect();
      loadGlobalConfig();
      fetchMonthDataFromSupabase();
    };

    function initYearMonthSelect() {
      const yearSelect = document.getElementById('yearSelect');
      const monthSelect = document.getElementById('monthSelect');
      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth() + 1;

      yearSelect.innerHTML = '';
      monthSelect.innerHTML = '';

      for (let y = currentYear - 1; y <= currentYear + 1; y++) {
        let opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y + "年";
        if (y === currentYear) opt.selected = true;
        yearSelect.appendChild(opt);
      }

      for (let m = 1; m <= 12; m++) {
        let opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m + "月";
        if (m === currentMonth) opt.selected = true;
        monthSelect.appendChild(opt);
      }

      yearSelect.onchange = onDateChange;
      monthSelect.onchange = onDateChange;
    }

    function onDateChange() {
      currentYear = parseInt(document.getElementById('yearSelect').value);
      currentMonth = parseInt(document.getElementById('monthSelect').value);
      fetchMonthDataFromSupabase();
    }

    function loadGlobalConfig() {
      const saved = localStorage.getItem('auto_schedule_global_config_v3');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          if (data.supportCumulativeMap) supportCumulativeMap = data.supportCumulativeMap;
        } catch(e) { console.error(e); }
      }
    }

    function saveGlobalConfig() {
      const data = { supportCumulativeMap: supportCumulativeMap };
      localStorage.setItem('auto_schedule_global_config_v3', JSON.stringify(data));
    }

    function fetchMonthDataFromSupabase() {
      showStatus("正在加载数据...", "info");

      // 先尝试从本地 Storage 加载当月独立排班
      const localKey = `schedule_${currentYear}_${currentMonth}`;
      const savedSchedule = localStorage.getItem(localKey);

      if (savedSchedule) {
        try {
          currentSchedule = JSON.parse(savedSchedule);
          showStatus(`${currentYear}年${currentMonth}月 本地数据加载成功！`, "success");
          renderAll();
          return;
        } catch(e) {}
      }

      // 若有 Supabase 则从数据库拉取
      if (supabaseClient) {
        supabaseClient
          .from('schedules')
          .select('*')
          .eq('year', currentYear)
          .eq('month', currentMonth)
          .then(({ data, error }) => {
            if (data && data.length > 0 && data[0].schedule_data) {
              currentSchedule = data[0].schedule_data;
              showStatus(`${currentYear}年${currentMonth}月 数据库数据加载成功！`, "success");
            } else {
              currentSchedule = null;
              showStatus(`未找到 ${currentYear}年${currentMonth}月 排班，请点击执行排班。`, "info");
            }
            renderAll();
          }).catch(() => {
            currentSchedule = null;
            showStatus("读取失败，请重新生成排班。", "error");
            renderAll();
          });
      } else {
        currentSchedule = null;
        showStatus(`未找到 ${currentYear}年${currentMonth}月 记录，请点击【执行智能排班】。`, "info");
        renderAll();
      }
    }

    function generateSchedule() {
      const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
      let schedule = Array.from({ length: staffs.length }, () => Array(daysInMonth).fill(""));

      // 模拟智能排班填充
      staffs.forEach((staff, sIdx) => {
        for (let d = 0; d < daysInMonth; d++) {
          if ((d + sIdx) % 7 === 0) {
            schedule[sIdx][d] = restShift.name;
          } else if ((d + sIdx * 3) % 12 === 0) {
            schedule[sIdx][d] = supportShift.name;
          } else {
            schedule[sIdx][d] = baseShifts[(d + sIdx) % baseShifts.length].name;
          }
        }
      });

      currentSchedule = schedule;
      // 保存至本地
      localStorage.setItem(`schedule_${currentYear}_${currentMonth}`, JSON.stringify(currentSchedule));
      showStatus("排班生成成功！", "success");
      renderAll();
    }

    function saveCurrentMonthToSupabase() {
      if (!currentSchedule) {
        alert("没有可保存的排班数据！");
        return;
      }
      localStorage.setItem(`schedule_${currentYear}_${currentMonth}`, JSON.stringify(currentSchedule));
      saveGlobalConfig();

      if (supabaseClient) {
        supabaseClient
          .from('schedules')
          .upsert({
            year: currentYear,
            month: currentMonth,
            schedule_data: currentSchedule
          }, { onConflict: 'year,month' })
          .then(() => showStatus("保存至 Supabase 成功！", "success"))
          .catch(e => showStatus("保存数据库失败: " + e.message, "error"));
      } else {
        showStatus("已成功独立保存至本地！", "success");
      }
    }

    function resetCurrentMonthData() {
      if (!confirm(`确定要重置 ${currentYear}年${currentMonth}月 的数据吗？`)) return;
      localStorage.removeItem(`schedule_${currentYear}_${currentMonth}`);
      currentSchedule = null;
      showStatus("当月数据已重置！", "success");
      renderAll();
    }

    function renderAll() {
      renderScheduleTable();
      renderStatsTable();
      renderSupportStaffTable();
    }

    function renderScheduleTable() {
      const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
      let html = `<thead><tr><th>姓名</th>`;

      for (let d = 1; d <= daysInMonth; d++) {
        let date = new Date(currentYear, currentMonth - 1, d);
        let isWeekend = date.getDay() === 0 || date.getDay() === 6;
        html += `<th class="${isWeekend ? 'weekend weekend-header' : ''}">${d}</th>`;
      }
      html += `</tr></thead><tbody>`;

      staffs.forEach((staff, sIdx) => {
        html += `<tr><td style="font-weight:bold;">${staff.name}</td>`;
        for (let d = 0; d < daysInMonth; d++) {
          let date = new Date(currentYear, currentMonth - 1, d + 1);
          let isWeekend = date.getDay() === 0 || date.getDay() === 6;
          let val = currentSchedule ? currentSchedule[sIdx][d] : "-";
          
          let cls = "";
          if (val === restShift.name) cls = "shift-rest";
          else if (val === supportShift.name) cls = "shift-support";
          else if (val === "岗位A") cls = "shift-high";
          else if (val !== "-") cls = "shift-normal";

          html += `<td class="${cls} ${isWeekend ? 'weekend' : ''}">${val}</td>`;
        }
        html += `</tr>`;
      });

      html += `</tbody>`;
      document.getElementById('scheduleTable').innerHTML = html;
    }

    function renderStatsTable() {
      let html = `<thead><tr><th>人员</th><th>当月工作天数</th><th>当月休息天数</th><th>当月支援天数</th></tr></thead><tbody>`;
      
      staffs.forEach((staff, sIdx) => {
        let work = 0, rest = 0, support = 0;
        if (currentSchedule && currentSchedule[sIdx]) {
          currentSchedule[sIdx].forEach(v => {
            if (v === restShift.name) rest++;
            else if (v === supportShift.name) support++;
            else if (v !== "-") work++;
          });
        }
        html += `<tr>
          <td style="font-weight:bold;">${staff.name}</td>
          <td>${work} 天</td>
          <td>${rest} 天</td>
          <td>${support} 天</td>
        </tr>`;
      });

      html += `</tbody>`;
      document.getElementById('statsTable').innerHTML = html;
    }

    // 修复的核心：支援表格计算逻辑
    function renderSupportStaffTable() {
      let records = [];

      staffs.forEach((staff, sIdx) => {
        let supportDays = [];
        if (currentSchedule && currentSchedule[sIdx]) {
          let totalDays = currentSchedule[sIdx].length;
          for (let d = 0; d < totalDays; d++) {
            if (currentSchedule[sIdx][d] === supportShift.name) {
              supportDays.push(`${d + 1}号`);
            }
          }
        }

        // 当月拿过支援标记为 1 次
        let currentMonthCount = supportDays.length > 0 ? 1 : 0;
        
        // 历史基础次数（如 Kay 8月拿过 1 次，基础就是 1）
        let historyBaseCount = (supportCumulativeMap[staff.name] || 0);

        // 如果是 8 月本身，总次数就是 8 月当月的次数 (即 1 次)
        // 如果到了 9 月及以后，总次数 = 8月历史次数 (1次) + 9月当月 (1次) = 2 次
        let totalCount = historyBaseCount;
        if (currentMonth > 8) {
          totalCount = historyBaseCount + currentMonthCount;
        } else if (currentMonth === 8) {
          totalCount = supportDays.length > 0 ? 1 : historyBaseCount;
        }

        if (supportDays.length > 0 || historyBaseCount > 0) {
          records.push({
            name: staff.name,
            currentDaysCount: supportDays.length,
            days: supportDays.length > 0 ? supportDays.join('、') : '无',
            totalCount: totalCount
          });
        }
      });

      let html = `
        <thead>
          <tr style="background-color: #f8fafc; font-weight: bold;">
            <th style="padding: 8px; width: 20%;">人员姓名</th>
            <th style="padding: 8px; width: 15%;">支援总天数</th>
            <th style="padding: 8px; width: 45%;">支援的具体日期</th>
            <th style="padding: 8px; width: 20%; color: #0d6efd;">拿过支援的总次数</th>
          </tr>
        </thead>
        <tbody>
      `;

      if (records.length === 0) {
        html += `<tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 12px;">暂无支援人员记录</td></tr>`;
      } else {
        records.forEach(item => {
          html += `
            <tr>
              <td style="font-weight: bold; padding: 8px;">${item.name}</td>
              <td style="font-weight: bold; color: #006064; padding: 8px;">${item.currentDaysCount} 天</td>
              <td class="shift-support" style="padding: 8px;">${item.days}</td>
              <td style="font-weight: bold; color: #0d6efd; padding: 8px;">第 ${item.totalCount} 次</td>
            </tr>
          `;
        });
      }

      html += `</tbody>`;
      document.getElementById('supportStaffTable').innerHTML = html;
    }

    function copySupportTable() {
      let table = document.getElementById('supportStaffTable');
      let text = table.innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert("支援记录表已复制到剪贴板！");
      });
    }

    function showStatus(msg, type) {
      const el = document.getElementById('statusMessage');
      el.className = `status-tag status-${type}`;
      el.textContent = msg;
    }
  </script>
</body>
</html>
