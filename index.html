<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能动态排班工作表 (跨月份独立保存版)</title>
  <!-- 1. 引入 Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 20px; background: #f4f6f8; margin: 0; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    h2, h3 { color: #1e293b; margin-top: 0; }
    .controls { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; margin-bottom: 15px; background: #f8fafc; padding: 12px; border-radius: 6px; }
    label { font-size: 14px; font-weight: bold; color: #475569; }
    select, input, button { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; transition: background 0.2s; font-weight: 500; }
    button:hover { background: #1d4ed8; }
    button.btn-success { background: #10b981; }
    button.btn-success:hover { background: #059669; }
    button.btn-danger { background: #ef4444; }
    button.btn-danger:hover { background: #dc2626; }
    .table-container { overflow-x: auto; margin-top: 15px; border: 1px solid #e2e8f0; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; background: white; }
    th, td { border: 1px solid #e2e8f0; padding: 6px 4px; min-width: 32px; }
    th { background: #f1f5f9; color: #334155; font-weight: 600; white-space: nowrap; }
    .weekend { background-color: #fef2f2; }
    .weekend-header { color: #ef4444; }
    
    /* 班别颜色样式 */
    .shift-rest { background-color: #fee2e2; color: #991b1b; font-weight: bold; }
    .shift-support { background-color: #e0f2fe; color: #075985; font-weight: bold; }
    .shift-high { background-color: #fef3c7; color: #92400e; font-weight: bold; }
    .shift-normal { background-color: #f1f5f9; color: #334155; }
    
    /* 规则配置区 */
    .rule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
    .rule-item { border: 1px solid #e2e8f0; padding: 10px; border-radius: 6px; background: #fafafa; }
    .staff-tag { display: inline-block; background: #e2e8f0; padding: 2px 8px; border-radius: 4px; margin: 2px; font-size: 12px; }
    .status-bar { padding: 8px 12px; border-radius: 4px; margin-bottom: 10px; font-size: 13px; }
    .status-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .status-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📅 智能动态排班工作表</h2>
    <div id="statusMessage"></div>
    <div class="controls">
      <div>
        <label>选择年份：</label>
        <select id="yearSelect"></select>
      </div>
      <div>
        <label>选择月份：</label>
        <select id="monthSelect"></select>
      </div>
      <button onclick="generateSchedule()">⚡ 执行智能排班</button>
      <button class="btn-success" onclick="saveCurrentMonthToSupabase()">💾 保存当前月至数据库</button>
      <button class="btn-danger" onclick="resetCurrentMonthData()">🔄 重置当前月份数据</button>
    </div>
  </div>

  <div class="card">
    <h3>📋 当月排班表</h3>
    <div class="table-container">
      <table id="scheduleTable"></table>
    </div>
  </div>

  <div class="card">
    <h3>📊 岗位与人员统计</h3>
    <div class="table-container">
      <table id="statsTable"></table>
    </div>
  </div>

  <div class="card">
    <h3>🔵 每月拿支援的人员记录表</h3>
    <div class="table-container">
      <table id="supportStaffTable"></table>
    </div>
  </div>

  <script>
    // Supabase 配置
    const SUPABASE_URL = "https://your-supabase-url.supabase.co"; // 替换为你的 Supabase URL
    const SUPABASE_KEY = "your-anon-key";             // 替换为你的 Supabase Anon Key
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 基础数据定义
    let staffs = [
      { id: 1, name: "妮妮" },
      { id: 2, name: "Kay" },
      { id: 3, name: "海绵" },
      { id: 4, name: "小兔" }
    ];

    let baseShifts = [
      { id: 1, name: "岗位A", highIntensity: true },
      { id: 2, name: "岗位B", highIntensity: false },
      { id: 3, name: "岗位C", highIntensity: false }
    ];

    let supportShift = { id: 99, name: "支援", highIntensity: false };
    let restShift = { id: 0, name: "休", highIntensity: false };

    let currentYear = 2026;
    let currentMonth = 3;
    let currentSchedule = null;

    // 跨月份历史支援数据存储对象
    let historicalSupportCounts = {};

    window.onload = function() {
      initYearMonthSelect();
      loadGlobalConfig();
      fetchMonthDataFromSupabase();
    };

    function initYearMonthSelect() {
      const yearSelect = document.getElementById('yearSelect');
      const monthSelect = document.getElementById('monthSelect');
      const now = new Date();
      currentYear = now.getFullYear();
      currentMonth = now.getMonth() + 1;

      for (let y = currentYear - 2; y <= currentYear + 2; y++) {
        let opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y + "年";
        if (y === currentYear) opt.selected = true;
        yearSelect.appendChild(opt);
      }

      for (let m = 1; m <= 12; m++) {
        let opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m + "月";
        if (m === currentMonth) opt.selected = true;
        monthSelect.appendChild(opt);
      }

      yearSelect.onchange = onDateChange;
      monthSelect.onchange = onDateChange;
    }

    function onDateChange() {
      currentYear = parseInt(document.getElementById('yearSelect').value);
      currentMonth = parseInt(document.getElementById('monthSelect').value);
      fetchMonthDataFromSupabase();
    }

    function loadGlobalConfig() {
      const saved = localStorage.getItem('auto_schedule_global_config_v2');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          if (data.staffs) staffs = data.staffs;
          if (data.historicalSupportCounts) historicalSupportCounts = data.historicalSupportCounts;
        } catch(e) { console.error(e); }
      }
    }

    function saveGlobalConfig() {
      const data = {
        staffs: staffs,
        historicalSupportCounts: historicalSupportCounts
      };
      localStorage.setItem('auto_schedule_global_config_v2', JSON.stringify(data));
    }

    // 从 Supabase 拉取当月及历史月份支援数据
    async function fetchMonthDataFromSupabase() {
      showStatus("正在加载数据...", "info");
      
      // 1. 获取当月排班
      try {
        const { data, error } = await supabaseClient
          .from('schedules')
          .select('*')
          .eq('year', currentYear)
          .eq('month', currentMonth)
          .single();

        if (data && data.schedule_data) {
          currentSchedule = data.schedule_data;
          showStatus(`${currentYear}年${currentMonth}月 数据加载成功！`, "success");
        } else {
          currentSchedule = null;
          showStatus(`未找到 ${currentYear}年${currentMonth}月 的排班记录，请点击执行排班。`, "info");
        }
      } catch (e) {
        currentSchedule = null;
        showStatus("读取当前月数据失败或无记录。", "info");
      }

      // 2. 统计当前月份之前的历史支援总次数
      await recalculateHistoricalSupportCounts();

      renderAll();
    }

    // 重新计算历史支援次数（遍历往期月份数据）
    async function recalculateHistoricalSupportCounts() {
      let counts = {};
      staffs.forEach(s => counts[s.name] = 0);

      try {
        const { data, error } = await supabaseClient
          .from('schedules')
          .select('year, month, schedule_data');

        if (data && !error) {
          data.forEach(row => {
            // 只累加早于当前选定年月的数据
            if (row.year < currentYear || (row.year === currentYear && row.month < currentMonth)) {
              if (row.schedule_data) {
                staffs.forEach((staff, sIdx) => {
                  if (row.schedule_data[sIdx]) {
                    const hasSupport = row.schedule_data[sIdx].includes(supportShift.name);
                    if (hasSupport) {
                      counts[staff.name] = (counts[staff.name] || 0) + 1;
                    }
                  }
                });
              }
            }
          });
        }
      } catch (e) {
        console.error("计算历史支援数据异常:", e);
      }

      historicalSupportCounts = counts;
      saveGlobalConfig();
    }

    function generateSchedule() {
      const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
      let schedule = Array.from({ length: staffs.length }, () => Array(daysInMonth).fill(""));

      // 简化的排班算法逻辑
      let supportIndex = (currentMonth - 1) % staffs.length;

      for (let day = 0; day < daysInMonth; day++) {
        for (let s = 0; s < staffs.length; s++) {
          if ((day + s) % 7 === 0) {
            schedule[s][day] = restShift.name;
          } else if (s === (supportIndex + Math.floor(day / 10)) % staffs.length && day % 15 === 0) {
            schedule[s][day] = supportShift.name;
          } else {
            let shiftIdx = (s + day) % baseShifts.length;
            schedule[s][day] = baseShifts[shiftIdx].name;
          }
        }
      }

      currentSchedule = schedule;
      showStatus("排班生成完毕，请点击保存！", "success");
      renderAll();
    }

    async function saveCurrentMonthToSupabase() {
      if (!currentSchedule) {
        alert("没有可保存的排班数据！");
        return;
      }

      showStatus("正在保存到数据库...", "info");
      try {
        const { data, error } = await supabaseClient
          .from('schedules')
          .upsert({
            year: currentYear,
            month: currentMonth,
            schedule_data: currentSchedule,
            updated_at: new Date()
          }, { onConflict: 'year,month' });

        if (error) throw error;
        showStatus("保存成功！", "success");
        await recalculateHistoricalSupportCounts();
        renderAll();
      } catch (e) {
        showStatus("保存失败: " + e.message, "error");
      }
    }

    async function resetCurrentMonthData() {
      if (!confirm(`确定要重置 ${currentYear}年${currentMonth}月 的数据吗？`)) return;

      try {
        await supabaseClient
          .from('schedules')
          .delete()
          .eq('year', currentYear)
          .eq('month', currentMonth);

        currentSchedule = null;
        showStatus("当月数据已重置！", "success");
        renderAll();
      } catch (e) {
        showStatus("重置失败: " + e.message, "error");
      }
    }

    function renderAll() {
      renderScheduleTable();
      renderStatsTable();
      renderSupportStaffTable();
    }

    function renderScheduleTable() {
      const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();
      let html = `<thead><tr><th>姓名</th>`;

      for (let d = 1; d <= daysInMonth; d++) {
        let date = new Date(currentYear, currentMonth - 1, d);
        let isWeekend = date.getDay() === 0 || date.getDay() === 6;
        html += `<th class="${isWeekend ? 'weekend weekend-header' : ''}">${d}</th>`;
      }
      html += `</tr></thead><tbody>`;

      staffs.forEach((staff, sIdx) => {
        html += `<tr><td style="font-weight:bold;">${staff.name}</td>`;
        for (let d = 0; d < daysInMonth; d++) {
          let date = new Date(currentYear, currentMonth - 1, d + 1);
          let isWeekend = date.getDay() === 0 || date.getDay() === 6;
          let val = currentSchedule ? currentSchedule[sIdx][d] : "-";
          
          let cls = "";
          if (val === restShift.name) cls = "shift-rest";
          else if (val === supportShift.name) cls = "shift-support";
          else if (val === "岗位A") cls = "shift-high";
          else if (val !== "-") cls = "shift-normal";

          html += `<td class="${cls} ${isWeekend ? 'weekend' : ''}">${val}</td>`;
        }
        html += `</tr>`;
      });

      html += `</tbody>`;
      document.getElementById('scheduleTable').innerHTML = html;
    }

    function renderStatsTable() {
      let html = `<thead><tr><th>人员</th><th>当月工作天数</th><th>当月休息天数</th><th>当月支援天数</th></tr></thead><tbody>`;
      
      staffs.forEach((staff, sIdx) => {
        let work = 0, rest = 0, support = 0;
        if (currentSchedule && currentSchedule[sIdx]) {
          currentSchedule[sIdx].forEach(v => {
            if (v === restShift.name) rest++;
            else if (v === supportShift.name) support++;
            else work++;
          });
        }
        html += `<tr>
          <td style="font-weight:bold;">${staff.name}</td>
          <td>${work} 天</td>
          <td>${rest} 天</td>
          <td>${support} 天</td>
        </tr>`;
      });

      html += `</tbody>`;
      document.getElementById('statsTable').innerHTML = html;
    }

    // 核心渲染：支持跨月累计的支援人员表格
    function renderSupportStaffTable() {
      let records = [];

      staffs.forEach((staff, sIdx) => {
        let supportDays = [];
        if (currentSchedule && currentSchedule[sIdx]) {
          let totalDays = currentSchedule[sIdx].length;
          for (let d = 0; d < totalDays; d++) {
            if (currentSchedule[sIdx][d] === supportShift.name) {
              supportDays.push(`${d + 1}号`);
            }
          }
        }

        // 當月是否拿過支援（拿過算 1 次）
        let currentMonthCount = supportDays.length > 0 ? 1 : 0;
        // 歷史月拿過支援的總次數（如 8 月拿過 1 次）
        let historyCount = historicalSupportCounts[staff.name] || 0;
        // 拿過支援的總次數 = 歷史次數 + 當月次數 (例: 1 + 1 = 2)
        let totalCount = historyCount + currentMonthCount;

        if (supportDays.length > 0 || historyCount > 0) {
          records.push({
            name: staff.name,
            currentDaysCount: supportDays.length,
            days: supportDays.length > 0 ? supportDays.join('、') : '无',
            totalCount: totalCount
          });
        }
      });

      let html = `
        <thead>
          <tr style="background-color: #f8fafc; font-weight: bold;">
            <th style="padding: 8px; width: 20%;">人员姓名</th>
            <th style="padding: 8px; width: 15%;">当月支援天数</th>
            <th style="padding: 8px; width: 45%;">当月支援的具体日期</th>
            <th style="padding: 8px; width: 20%; color: #0d6efd;">拿过支援的总次数</th>
          </tr>
        </thead>
        <tbody>
      `;

      if (records.length === 0) {
        html += `<tr><td colspan="4" style="text-align: center; color: #94a3b8; padding: 12px;">暂无支援人员记录</td></tr>`;
      } else {
        records.forEach(item => {
          html += `
            <tr>
              <td style="font-weight: bold; padding: 8px;">${item.name}</td>
              <td style="font-weight: bold; color: #006064; padding: 8px;">${item.currentDaysCount} 天</td>
              <td class="shift-support" style="padding: 8px;">${item.days}</td>
              <td style="font-weight: bold; color: #0d6efd; padding: 8px;">第 ${item.totalCount} 次</td>
            </tr>
          `;
        });
      }

      html += `</tbody>`;
      document.getElementById('supportStaffTable').innerHTML = html;
    }

    function showStatus(msg, type) {
      const el = document.getElementById('statusMessage');
      let cls = type === "success" ? "status-success" : (type === "error" ? "status-error" : "status-bar");
      el.className = `status-bar ${cls}`;
      el.textContent = msg;
    }
  </script>
</body>
</html>
